name: Java CI

on:
  push:
    branches: [ hw1 ]
  pull_request:
    branches: [ hw1 ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
      - name: Build project
        run: ./gradlew clean build --no-daemon

  integration-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
      - name: Build and install app
        run: ./gradlew :app:installDist --no-daemon
      - name: Run integration tests
        run: |
          ./app/build/install/app/bin/app --password 12345678 --loglevel WARN | grep "Strength: WEAK"
          ./app/build/install/app/bin/app --password qwerty123! --loglevel WARN | grep "Strength: MEDIUM"
          ./app/build/install/app/bin/app --password Qwerty123!@# --loglevel WARN | grep "Strength: STRONG"
