[versions]
picoCli = "4.7.7"
slf4j = "2.0.17"
log4j = "2.25.1"
logback = "1.5.18"
junit = "5.12.2"
junitplatform = "1.13.4"
jcommander = "1.82"


[libraries]
picocli = { group = "info.picocli", name = "picocli", version.ref = "picoCli" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
slf4j-log4j-impl = { group = "org.apache.logging.log4j", name = "log4j-slf4j2-impl", version.ref = "log4j" }
slf4j-logback-impl = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitplatform" }
junit-jupiter-core = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
jcommander = { group = "com.beust", name = "jcommander", version.ref = "jcommander" }